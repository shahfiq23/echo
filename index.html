<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Echo">
<meta name="theme-color" content="#07080D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Echo</title>
<style>
/* Accent hue/saturation come from the playing song's cover and glide between songs. */
@property --th{syntax:'<number>';inherits:true;initial-value:220}
@property --ts{syntax:'<percentage>';inherits:true;initial-value:60%}
:root{
  --th:220;--ts:60%;
  --bg:#07080D;--bg2:#0E1016;--elev:#171921;--sheet:rgba(24,26,34,.94);
  --card:rgba(255,255,255,.045);--card-b:rgba(255,255,255,.075);
  --label:#F4F5F9;--label2:rgba(232,235,244,.56);--label3:rgba(232,235,244,.28);
  --sep:rgba(255,255,255,.07);--fill:rgba(255,255,255,.07);--fill2:rgba(255,255,255,.13);
  --tint:hsl(var(--th) var(--ts) 76%);
  --tint-soft:hsl(var(--th) var(--ts) 76% / .14);
  --glow:hsl(var(--th) var(--ts) 46% / .30);
  --red:#FF5C61;--ink:#0A0B10;
  --shadow:0 18px 40px rgba(0,0,0,.55);
  color-scheme:dark;
  transition:--th 1s ease,--ts 1s ease;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(110% 55% at 50% -12%,var(--glow),transparent 62%)}
body.lock{overflow:hidden}
input{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:disabled{opacity:.35}
svg{display:block}
[hidden]{display:none!important}

/* ---------- Pages ---------- */
.tab{display:none;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 100px);max-width:680px;margin:0 auto}
body.has-mini .tab{padding-bottom:calc(env(safe-area-inset-bottom) + 170px)}
.tab.on{display:block}
.hello{font-size:14px;font-weight:500;color:var(--label2);margin:6px 0 0;min-height:17px}
.large{font-size:32px;font-weight:600;letter-spacing:-.4px;margin:2px 0 2px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sub{color:var(--label3);font-size:14px;margin:0 0 18px;min-height:17px}
.icon-btn{width:38px;height:38px;border-radius:19px;background:var(--card);border:1px solid var(--card-b);display:grid;place-items:center;color:var(--label);flex:none}
.icon-btn svg{width:18px;height:18px}
.navbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;min-height:38px}
.back{display:flex;align-items:center;gap:2px;color:var(--label2);font-size:16px;margin-left:-6px}
.back svg{width:24px;height:24px}

.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--card-b);border-radius:14px;padding:0 12px;height:42px;margin-bottom:12px;color:var(--label3)}
.search svg{width:16px;height:16px;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;color:var(--label);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--label3)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}

.seg{display:flex;background:var(--card);border:1px solid var(--card-b);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{flex:1;font-size:13px;font-weight:500;padding:7px 0;border-radius:9px;color:var(--label2);transition:background .25s,color .25s}
.seg button.on{background:var(--fill2);color:var(--label);font-weight:600}
.seg.small{margin:0;width:160px;flex:none}

.btns{display:flex;gap:10px;margin:0 0 20px}
.btns .btn{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--label);color:var(--ink);font-weight:600;font-size:16px;border-radius:24px;height:46px;padding:0 24px;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97);opacity:.85}
.btn svg{width:16px;height:16px}
.btn.soft{background:var(--card);border:1px solid var(--card-b);color:var(--label)}

/* ---------- Lists ---------- */
.group{background:var(--card);border:1px solid var(--card-b);border-radius:20px;overflow:hidden;margin-bottom:26px}
.ghead{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--label3);margin:0 6px 8px}
.gfoot{font-size:13px;color:var(--label3);margin:-18px 6px 26px;line-height:1.4}
.row{display:flex;align-items:center;gap:13px;padding:9px 8px 9px 12px;min-height:46px;position:relative;width:100%;text-align:left;cursor:pointer;transition:background .15s}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:70px;height:1px;background:var(--sep)}
.row.plain{padding:13px 16px}
.row.plain+.row.plain::before{left:16px}
.row:active{background:var(--fill)}
.row.static{cursor:default}.row.static:active{background:none}
.lbl{flex:1;font-size:16px}
.val{color:var(--label2);font-size:16px;text-align:right}
.link{color:var(--tint)}
.chev{color:var(--label3);flex:none}.chev svg{width:14px;height:14px}
.meta{flex:1;min-width:0}
.t1{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.row.cur .t1{color:var(--tint)}
.more{width:36px;height:36px;display:grid;place-items:center;color:var(--label3);flex:none;border-radius:18px}
.more svg{width:18px;height:18px}
.more:active{background:var(--fill)}
.none{color:var(--label3);text-align:center;padding:24px 0;font-size:14px;margin:0}

/* ---------- Artwork ---------- */
.art{width:46px;height:46px;border-radius:50%;flex:none;background-size:cover;background-position:center;display:grid;place-items:center;overflow:hidden;background-color:var(--elev)}
.art.ph{background-image:radial-gradient(circle at 34% 28%,hsl(var(--h,220) 22% 27%),hsl(var(--h,220) 26% 11%))}
.art.ph svg{width:40%;height:40%;color:hsl(var(--h,220) 45% 80% / .85)}
.art.sq{border-radius:12px}
.art.add{background:var(--fill);color:var(--label)}
.art.add svg{width:20px;height:20px}
.art.full{width:100%;height:100%;border-radius:50%}
.art.big{width:200px;height:200px;border-radius:24px;box-shadow:var(--shadow)}
.mosaic{display:grid;grid-template-columns:1fr 1fr;width:46px;height:46px;border-radius:12px;overflow:hidden;flex:none}
.mosaic .art{width:100%;height:100%;border-radius:0}
.mosaic.big{width:200px;height:200px;border-radius:24px;box-shadow:var(--shadow)}
.mosaic .art.ph svg{width:34%}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:10px;margin-right:6px;vertical-align:0}
.eq i{width:2.5px;background:var(--tint);border-radius:1px;height:40%;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
body:not(.playing) .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:52px 20px 10px}
.empty .big{width:120px;height:120px;margin:0 auto 26px}
.empty .big svg{width:100%;height:100%}
.empty h2{font-size:22px;font-weight:600;margin:0 0 8px}
.empty p{color:var(--label2);font-size:15px;margin:0 auto 26px;line-height:1.5;max-width:290px}
.steps{text-align:left;margin-top:38px}

/* ---------- Playlist header ---------- */
.plhead{text-align:center;margin:8px 0 22px}
.plhead>.art,.plhead>.mosaic{margin:0 auto 18px}
.plhead h2{font-size:24px;font-weight:600;margin:0 0 4px}
.plhead p{color:var(--label3);font-size:14px;margin:0}

/* ---------- Tab bar + mini player ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:0;padding:14px 0 calc(env(safe-area-inset-bottom) + 4px);z-index:20;background:linear-gradient(to top,var(--bg) 58%,rgba(7,8,13,0))}
.tabbar button{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 4px;font-size:10px;font-weight:500;color:var(--label3);transition:color .25s}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--label)}
.tabbar button i{width:4px;height:4px;border-radius:2px;background:transparent;transition:background .25s}
.tabbar button.on i{background:var(--tint)}
.tabbar button.pop svg{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(.82)}75%{transform:scale(1.08)}}

.mini{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 66px);z-index:19;display:none;align-items:center;gap:12px;height:64px;padding:0 8px 0 8px;border-radius:32px;background:rgba(20,22,30,.88);-webkit-backdrop-filter:saturate(160%) blur(22px);backdrop-filter:saturate(160%) blur(22px);border:1px solid var(--card-b);box-shadow:var(--shadow);cursor:pointer;max-width:656px;margin:0 auto}
.mini.show{display:flex;animation:up .45s cubic-bezier(.2,.8,.2,1)}
.mini .t1{font-size:15px}
.mini .t2{font-size:12px;margin-top:2px}
.mdisc{width:48px;height:48px;position:relative;flex:none}
.mdisc svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.mdisc .rt{fill:none;stroke:var(--fill2);stroke-width:4}
.mdisc .rp{fill:none;stroke:var(--tint);stroke-width:4;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000}
.mdisc .spin{position:absolute;inset:5px;border-radius:50%;overflow:hidden}
.ctl{width:42px;height:42px;display:grid;place-items:center;border-radius:21px;flex:none;color:var(--label)}
.ctl svg{width:22px;height:22px}
.ctl:active{background:var(--fill)}

/* ---------- Spin ---------- */
.spin{animation:spin 26s linear infinite;animation-play-state:paused}
body.playing .spin{animation-play-state:running}
.vinyl .spin.platter{animation-duration:3.6s}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Now Playing ---------- */
.np{position:fixed;inset:0;z-index:40;background:var(--bg);transform:translateY(100%);transition:transform .5s cubic-bezier(.32,.72,0,1);overflow:hidden;isolation:isolate;visibility:hidden}
.np.open{transform:none;visibility:visible}
.np.moving{visibility:visible}
.np-bg{position:absolute;inset:-25%;z-index:-2;background-size:cover;background-position:center;filter:blur(90px) saturate(1.4);opacity:.32;transition:opacity .6s}
.np-bg.ph{background-image:radial-gradient(circle at 50% 30%,var(--glow),transparent 60%);filter:none;opacity:1}
.np::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to bottom,rgba(7,8,13,.15),rgba(7,8,13,.55) 55%,var(--bg) 92%)}
.np-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.np-main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 4px) 22px calc(env(safe-area-inset-bottom) + 10px)}
.np-bar{display:flex;align-items:center;justify-content:space-between;height:46px}
.np-bar .lbl2{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--label3)}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:21px;color:var(--label2);position:relative;transition:color .2s,background .2s}
.ib svg{width:22px;height:22px}
.ib:active{background:var(--fill)}
.ib.on{color:var(--tint)}
.ib.on::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--tint)}
.np-head{display:flex;align-items:flex-start;gap:12px;margin:12px 2px 0}
.np-head .meta .t1{font-size:28px;font-weight:500;letter-spacing:-.4px}
.np-head .meta .t2{font-size:16px;margin-top:4px}
.disc-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 0 8px;min-height:0}
.disc{position:relative;width:min(80vw,42vh,380px);aspect-ratio:1;touch-action:none;cursor:pointer}
.disc .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.disc .rt{fill:none;stroke:var(--fill2);stroke-width:1.2}
.disc .rp{fill:none;stroke:var(--tint);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;transition:stroke .6s}
.disc.drag .rp{stroke-width:2.6}
.bezel{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.02),rgba(255,255,255,.045));box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 30px 70px rgba(0,0,0,.55)}
.platter{position:absolute;inset:10.5%;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.vinyl .platter{inset:8.5%;background:#0B0B0E}
.grooves{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#0C0C0F 0,#0C0C0F 1.4px,#17171C 1.9px,#0C0C0F 2.6px)}
.vlabel{position:absolute;inset:31%;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px #0B0B0E,0 0 0 3px rgba(255,255,255,.06)}
.vlabel .art.ph svg{display:none}
.hole{position:absolute;left:50%;top:50%;width:4.5%;height:4.5%;margin:-2.25% 0 0 -2.25%;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.12)}
.sheen{position:absolute;inset:8.5%;border-radius:50%;pointer-events:none;display:none;background:conic-gradient(from 25deg,transparent 0 6%,rgba(255,255,255,.075) 11%,transparent 17% 50%,rgba(255,255,255,.055) 61%,transparent 67%)}
.vinyl .sheen{display:block}
.knob{position:absolute;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px var(--tint-soft),0 2px 8px rgba(0,0,0,.6);left:50%;top:3%;transition:transform .2s}
.disc.drag .knob{transform:scale(1.3)}
.time-pill{margin-top:-13px;position:relative;z-index:2;background:var(--bg2);border:1px solid var(--card-b);border-radius:14px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--label2);font-variant-numeric:tabular-nums;transition:color .2s}
.disc.drag+.time-pill{color:var(--tint)}
.ctrls{display:flex;justify-content:space-between;align-items:center;margin:20px 0 14px;padding:0 4px}
.ctrls .sk{width:56px;height:56px;display:grid;place-items:center;border-radius:28px;color:var(--label);transition:transform .15s,background .15s}
.ctrls .sk svg{width:26px;height:26px}
.ctrls .sk:active{transform:scale(.88);background:var(--fill)}
.ctrls .pp{width:74px;height:74px;display:grid;place-items:center;border-radius:50%;background:var(--label);color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 6px var(--tint-soft);transition:transform .15s,box-shadow .6s}
.ctrls .pp svg{width:28px;height:28px}
.ctrls .pp:active{transform:scale(.92)}
.extras{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.chip{height:34px;padding:0 13px;border-radius:17px;background:var(--card);border:1px solid var(--card-b);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--label2);font-variant-numeric:tabular-nums;transition:color .2s,border-color .2s}
.chip svg{width:16px;height:16px}
.chip.on{color:var(--tint);border-color:var(--tint-soft)}
.chip.jump{display:none}
.np.long .chip.jump{display:flex}
.np-hint{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:18px;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--label3)}
.np-hint svg{width:16px;height:16px;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.np-next{padding:6px 22px calc(env(safe-area-inset-bottom) + 34px)}
.np-next h3{font-size:20px;font-weight:600;margin:4px 4px 12px}

/* ---------- Modals ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;transition:opacity .3s}
.scrim.show{opacity:1}
.alert{position:fixed;left:50%;top:46%;width:280px;transform:translate(-50%,-50%) scale(1.1);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.3,1.2),opacity .2s;background:var(--sheet);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid var(--card-b);border-radius:20px;z-index:61;text-align:center;overflow:hidden}
.alert.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.alert .bd{padding:20px 18px 16px}
.alert h3{font-size:17px;margin:0 0 5px;font-weight:600}
.alert p{font-size:13px;margin:0;line-height:1.4;color:var(--label2)}
.alert input{width:100%;margin-top:14px;padding:10px 12px;border-radius:12px;border:1px solid var(--card-b);background:var(--fill);color:var(--label);font-size:15px;outline:none}
.alert input+input{margin-top:8px}
.alert .ab{display:flex;border-top:1px solid var(--sep)}
.alert .ab button{flex:1;padding:13px 0;font-size:16px;color:var(--label2)}
.alert .ab button+button{border-left:1px solid var(--sep)}
.alert .ab .bold{font-weight:600;color:var(--tint)}
.alert .ab .danger{color:var(--red);font-weight:600}
.asheet{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:61;transform:translateY(130%);transition:transform .4s cubic-bezier(.32,.72,0,1);max-width:520px;margin:0 auto}
.asheet.show{transform:none}
.asheet .g{background:var(--sheet);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid var(--card-b);border-radius:20px;overflow:hidden;margin-bottom:8px;max-height:62vh;overflow-y:auto}
.asheet .hd{padding:15px 18px;text-align:center;font-size:13px;color:var(--label3);border-bottom:1px solid var(--sep);line-height:1.4}
.asheet .hd b{display:block;color:var(--label2);font-weight:600;font-size:14px}
.asheet .g button{display:block;width:100%;padding:16px 14px;font-size:17px;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asheet .g button+button{border-top:1px solid var(--sep)}
.asheet .g button:active{background:var(--fill)}
.asheet .danger{color:var(--red)!important}
.asheet .sel{color:var(--tint)!important;font-weight:600}
.asheet .cancel{font-weight:600}
.fsheet{position:fixed;left:0;right:0;bottom:0;height:calc(100% - env(safe-area-inset-top) - 14px);z-index:61;background:var(--bg2);border:1px solid var(--card-b);border-bottom:0;border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .45s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;max-width:680px;margin:0 auto}
.fsheet.show{transform:none}
.fsheet .nav{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 12px;gap:8px}
.fsheet .nav h3{margin:0;font-size:17px;font-weight:600;flex:1;text-align:center}
.fsheet .nav button{color:var(--label2);font-size:16px;min-width:64px;text-align:left}
.fsheet .nav .r{text-align:right;font-weight:600;color:var(--tint)}
.fsheet .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(env(safe-area-inset-bottom) + 24px)}
.chk{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--label3);flex:none;display:grid;place-items:center;transition:background .2s,border-color .2s;margin-right:6px}
.chk.on{background:var(--tint);border-color:var(--tint)}
.chk.on::after{content:"";width:6px;height:11px;border:solid var(--ink);border-width:0 2.3px 2.3px 0;transform:translate(0,-1px) rotate(45deg);animation:tick .25s ease}
@keyframes tick{from{transform:translate(0,-1px) rotate(45deg) scale(.3)}}
.tg{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;transition:background .25s;flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.3,1.4,.6,1)}
.tg.on{background:var(--tint)}.tg.on::after{transform:translateX(20px)}

/* ================= Database ================= */
let db;
function openDB() {

/* ---------- Accent colour from cover art ---------- */
const DEFAULT_TINT = [220, 60];
const hashTint = id => [hash(id) % 360, 34];

}
// Average the cover's colours, weighting vivid pixels, then soften so text stays readable.
async function tintFromBlob(blob) {
  if (!blob) return null;
  try {
    const bmp = await createImageBitmap(blob);
    const c = document.createElement('canvas'); c.width = c.height = 28;
    const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(bmp, 0, 0, 28, 28);
    const d = x.getImageData(0, 0, 28, 28).data;
    let R = 0, G = 0, B = 0, W = 0, satSum = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), sat = mx ? (mx - mn) / mx : 0;

    let h = 0;
    if (mx !== mn) {

  } catch { return null; }

/* ================= Tag reading (ID3v2.3/2.4) ================= */
function decodeText(enc, d) {

  if (enc === 1 || enc === 2) { while (i + 1 < d.length && !(d[i] === 0 && d[i + 1] === 0)) i += 2; i += 2; }
  else { while (i < d.length && d[i] !== 0) i++; i++; }

function parseID3(b) {

async function shrinkArt(blob) {

    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));

}

/* ================= Import ================= */
async function importFiles(list) {
  const files = [...list].filter(f => /^audio\//.test(f.type) || /\.(mp3|m4a|aac|wav)$/i.test(f.name));
  if (!files.length) { toast('No audio files selected'); return; }
  let ok = 0, dup = 0, fail = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (tracks.some(t => t.file === f.name && t.size === f.size)) { dup++; continue; }
    toast(files.length > 1 ? `Importing ${i + 1} of ${files.length}…` : 'Importing…', 0);

    catch (e) {
      console.error(e); fail++;

/* ---------- Seeking ----------
   iOS often hasn't loaded a paused song yet (no duration, seeks ignored), so a seek is

// Artwork for the Lock Screen and Dynamic Island: a record with the song's cover as its centre label.
const vinylCache = new Map();
function vinylArt(t) {
  if (!vinylCache.has(t.id)) vinylCache.set(t.id, (async () => {
    const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d'), cx = S / 2, R = S * .47, L = R * .4;
    x.fillStyle = '#07080D'; x.fillRect(0, 0, S, S);
    x.beginPath(); x.arc(cx, cx, R, 0, Math.PI * 2); x.fillStyle = '#111217'; x.fill();
    x.strokeStyle = 'rgba(255,255,255,0.055)'; x.lineWidth = 2;

    x.strokeStyle = 'rgba(255,255,255,0.07)'; x.beginPath(); x.arc(cx, cx, R * .78, 1.04, 1.94); x.stroke();

    x.beginPath(); x.arc(cx, cx, S * .02, 0, Math.PI * 2); x.fillStyle = '#07080D'; x.fill();

function closeNP() { np.classList.remove('open'); document.body.classList.remove('lock'); }
function bindNP() {
  // Drag around the ring to scrub. Tap the cover to play or pause.
  const disc = $('#disc');
  const where = e => {
    const b = disc.getBoundingClientRect();
    const x = e.clientX - (b.left + b.width / 2), y = e.clientY - (b.top + b.height / 2);
    let a = Math.atan2(x, -y); if (a < 0) a += 2 * Math.PI;
    return { r: a / (2 * Math.PI), dist: Math.hypot(x, y) / (b.width / 2) };
  };
  let last = 0, moved = false, downIn = false;
  const show = r => { const d = curDur(); setRing(r); $('#npTime').textContent = `${fmt(r * d)} / ${fmt(d)}`; };
  disc.addEventListener('pointerdown', e => {
    const w = where(e); moved = false;
    downIn = w.dist < .72;
    if (downIn || !curId() || !curDur()) return;
    dragging = true; try { disc.setPointerCapture(e.pointerId); } catch {}
    disc.classList.add('drag'); last = w.r; show(last);
  });
  disc.addEventListener('pointermove', e => {
    if (!dragging) return;
    let r = where(e).r;
    if (Math.abs(r - last) > .5) r = last > .5 ? 1 : 0; // don't wrap past the top
    last = r; moved = true; show(r);
  });
  const end = () => { if (!dragging) return; dragging = false; disc.classList.remove('drag'); seekTo(last * curDur()); };
  disc.addEventListener('pointerup', end);
  disc.addEventListener('pointercancel', end); // iOS can cancel a drag mid-way: still jump to where the finger was
  disc.addEventListener('click', e => { if (downIn && where(e).dist < .72) togglePlay(); });
  // Swipe down on the header to close
  const top = $('#npTop'), sc = $('#npScroll'); let sy = null, dy = 0;
  top.addEventListener('touchstart', e => { if (sc.scrollTop > 0) return; sy = e.touches[0].clientY; dy = 0; np.style.transition = 'none'; np.classList.add('moving'); }, { passive: true });
  top.addEventListener('touchmove', e => { if (sy == null) return; dy = Math.max(0, e.touches[0].clientY - sy); np.style.transform = `translateY(${dy}px)`; }, { passive: true });
  const fin = () => { if (sy == null) return; np.style.transition = ''; np.style.transform = ''; np.classList.remove('moving'); if (dy > 110) closeNP(); sy = null; };
  top.addEventListener('touchend', fin); top.addEventListener('touchcancel', fin);
}

async function showQueue() {
  await fullSheet({
    title: 'Up Next', right: 'Done',
    build(body, done) {
      const cur = byId(curId());
      const up = P.queue.slice(P.idx + 1).map((id, j) => ({ t: byId(id), i: P.idx + 1 + j })).filter(x => x.t);
      body.innerHTML = `${cur ? `<p class="qlabel">Now Playing</p><div class="group"><div class="row cur static">${artHTML(cur)}<div class="meta"><div class="t1">${esc(cur.title)}</div><div class="t2">${esc(cur.artist || 'Unknown Artist')}</div></div></div></div>` : ''}
        <p class="qlabel">Up Next${P.shuffle ? ' · Shuffled' : ''}</p>
        <div class="group">${up.map(x => `<div class="row" data-q="${x.i}">${artHTML(x.t)}<div class="meta"><div class="t1">${esc(x.t.title)}</div><div class="t2">${esc(x.t.artist || 'Unknown Artist')} · ${fmt(x.t.duration)}</div></div></div>`).join('') || `<p class="none">${P.repeat === 'all' ? 'Repeats from the start' : 'Nothing else queued'}</p>`}</div>`;
      hydrate(body);
      body.addEventListener('click', e => { const r = e.target.closest('[data-q]'); if (!r) return; prime(); loadIdx(+r.dataset.q, true); done('pick'); });
    }
  });
}
async function npMenu() {
  const id = curId(); const t = byId(id); if (!t) return;
  const k = await actionSheet({ title: t.title, sub: t.artist || 'Unknown Artist', items: [{ k: 'style', label: settings.style === 'vinyl' ? 'Switch to Ring Style' : 'Switch to Vinyl Style' }, { k: 'addpl', label: 'Add to Playlist…' }, { k: 'edit', label: 'Edit Title & Artist' }] });
  if (k === 'style') setStyle(settings.style === 'vinyl' ? 'ring' : 'vinyl');
  else if (k === 'addpl') addToPlaylist([id]);
  else if (k === 'edit') editInfo(id);
}
function setStyle(v) { settings.style = v; saveSettings(); const t = byId(curId()); if (t) renderDisc(t); if ($('#t-set').classList.contains('on')) renderSettings(); }
function switchTab(k) {
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('on', s.id === 't-' + k));
  document.querySelectorAll('#tabbar button').forEach(b => {
    const on = b.dataset.tab === k; b.classList.toggle('on', on);
    if (on) { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
  });
  if (k === 'set') renderSettings();
  if (k === 'lib') $('#hello').textContent = `${greeting()}, ${NAME}`;
  window.scrollTo(0, 0);
}

/* ================= Actions ================= */
const ACT = {
  tab: a => { if (a.classList.contains('on') && a.dataset.tab === 'pl' && openPl) closePl(); switchTab(a.dataset.tab); },
  import: () => $('#file').click(),
  sort: a => { settings.sort = a.dataset.v; saveSettings(); renderLibrary(); },
  play: (a, id, ctx) => {
    if (curId() === id && P.loadedId === id) { openNP(); return; }
    prime(); const ids = ctxIds(ctx); playList(ids, ids.indexOf(id));
  },
  more: (a, id, ctx) => trackMenu(id, ctx),
  playall: () => { prime(); playList(ctxIds('lib'), 0, false); },
  shuffleall: () => { prime(); playList(ctxIds('lib'), -1, true); },
  toggle: () => togglePlay(),
  next: () => next(),
  prev: () => prev(),
  jumpb: () => seekBy(-settings.skip),
  jumpf: () => seekBy(settings.skip),
  npopen: () => openNP(),
  npclose: () => closeNP(),
  npmore: () => npMenu(),
  shuffle: () => toggleShuffle(),
  repeat: () => cycleRepeat(),
  speed: () => speedMenu(),
  sleep: () => sleepMenu(),
  queue: () => showQueue(),
  newpl: () => createPlaylist(true),
  openpl: (a, id) => openPlaylist(id),
  plback: () => closePl(),
  plmore: () => playlistMenu(),
  pladd: () => { const pl = playlists.find(p => p.id === openPl); if (pl) { if (tracks.length) pickSongs(pl); else toast('Import some songs first'); } },
  plplay: () => { prime(); playList(ctxIds('pl:' + openPl), 0, false); },
  plshuffle: () => { prime(); playList(ctxIds('pl:' + openPl), -1, true); },
  persist: async () => { await requestPersist(); let ok = false; try { ok = await navigator.storage.persisted(); } catch {} toast(ok ? 'Music is protected' : "iPhone didn't allow it yet. Keep Echo on your Home Screen and try later."); renderSettings(); },
  resume: () => { settings.resume = !settings.resume; saveSettings(); renderSettings(); },
  skipint: a => { settings.skip = +a.dataset.v; saveSettings(); renderSettings(); renderNow(); },
  checkupd: async () => {
    if (!swReg) { toast("Updates aren't available here"); return; }
    toast('Checking…', 0);
    try { await swReg.update(); } catch {}
    setTimeout(() => toast(swReg.installing || swReg.waiting ? 'Updating…' : "You're on the latest version"), 900);
  },
  wipe: () => wipeAll(),
  style: a => setStyle(a.dataset.v),
  npq: a => { prime(); loadIdx(+a.dataset.i, true); $('#npScroll').scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); },
  npnext: () => { const w = $('#npNextWrap'); $('#npScroll').scrollTo({ top: w.offsetTop - 10, behavior: reduceMotion ? 'auto' : 'smooth' }); }
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const f = ACT[a.dataset.act]; if (f) f(a, a.dataset.id, a.dataset.ctx, e);
});
document.addEventListener('touchstart', () => {}, { passive: true });
$('#file').addEventListener('change', e => { const f = e.target.files; if (f && f.length) importFiles(f); e.target.value = ''; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (P.loadedId) savePos(); }
  else { $('#hello').textContent = `${greeting()}, ${NAME}`; if (swReg) swReg.update().catch(() => {}); if (pendingReload && audio.paused) location.reload(); }
});

/* ================= Launch animation ================= */
// A ring draws itself around the screen centre, then a small record drops in and starts turning.
function runSplash() {
  const sp = $('#splash');
  if (reduceMotion) { sp.remove(); return; }
  sp.innerHTML = `<svg viewBox="0 0 100 100">
    <circle class="r1" cx="50" cy="50" r="47" pathLength="1"/>
    <g class="d"><g class="g">
      <circle cx="50" cy="50" r="38" fill="#121319"/>
      ${[33, 28, 23].map(r => `<circle cx="50" cy="50" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width=".8"/>`).join('')}
      <path d="M50 14a36 36 0 0 1 30 16" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="13" fill="#A8C4FF"/><circle cx="50" cy="50" r="2" fill="#07080D"/>
    </g></g></svg>`;
  const hide = () => { if (!sp.isConnected) return; sp.classList.add('out'); setTimeout(() => sp.remove(), 480); };
  sp.addEventListener('click', hide);
  setTimeout(hide, 1750);
}

/* ================= Updates ================= */
let swReg = null, pendingReload = false;
if ('serviceWorker' in navigator && location.protocol === 'https:' || location.hostname === 'localhost') {
  if ('serviceWorker' in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { swReg = r; r.update().catch(() => {}); }).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController) return;
      if (audio.paused) location.reload(); else pendingReload = true;
    });
  }
}

/* ================= Start ================= */
(async () => {
  runSplash();
  buildShell(); bindNP();
  try { db = await openDB(); }
  catch (e) { renderAll(); alertBox({ title: "Storage Isn't Available", msg: 'Echo needs on-device storage to save music. Private Browsing turns this off.' }); return; }
  tracks = await idb.all('tracks');
  playlists = (await idb.all('playlists')).sort((a, b) => a.createdAt - b.createdAt);
  const s = LS.get('player', null);
  if (s) {
    P.shuffle = !!s.shuffle; P.repeat = s.repeat || 'off'; P.speed = s.speed || 1;
    P.queue = (s.queue || []).filter(byId); P.order = (s.order || []).filter(byId);
    P.idx = s.cur ? P.queue.indexOf(s.cur) : -1;
  }
  renderAll();
  if (P.idx >= 0) await loadIdx(P.idx, false, s.pos || 0);
})();
</script>
</body>
