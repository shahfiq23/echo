<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Echo">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Echo</title>
<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--elev:#FFFFFF;--seg-on:#FFFFFF;
  --label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.2);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.22);
  --pink:#FF2D55;--indigo:#5856D6;--orange:#FF9500;--blue:#007AFF;--red:#FF3B30;--green:#34C759;
  --bar:rgba(249,249,249,.84);--sheet:rgba(242,242,247,.92);
  --shadow:0 8px 30px rgba(0,0,0,.12);
  --grad:linear-gradient(90deg,var(--indigo),var(--pink),var(--orange));
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1C1C1E;--elev:#2C2C2E;--seg-on:#636366;
  --label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);
  --pink:#FF375F;--indigo:#5E5CE6;--orange:#FF9F0A;--blue:#0A84FF;--red:#FF453A;--green:#30D158;
  --bar:rgba(22,22,24,.8);--sheet:rgba(30,30,32,.9);
  --shadow:0 8px 30px rgba(0,0,0,.55);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior-y:none}
body.lock{overflow:hidden}
input{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:disabled{opacity:.4}
svg{display:block}
[hidden]{display:none!important}

/* ---------- Pages ---------- */
.tab{display:none;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px);max-width:680px;margin:0 auto}
body.has-mini .tab{padding-bottom:calc(env(safe-area-inset-bottom) + 160px)}
.tab.on{display:block}
.hello{font-size:15px;font-weight:600;margin:4px 0 0;display:inline-block;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.large{font-size:34px;font-weight:700;letter-spacing:.3px;margin:2px 0 2px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sub{color:var(--label2);font-size:15px;margin:0 0 16px;min-height:18px}
.icon-btn{width:34px;height:34px;border-radius:17px;background:var(--fill);display:grid;place-items:center;color:var(--pink);flex:none}
.icon-btn svg{width:20px;height:20px}
.navbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px;min-height:34px}
.back{display:flex;align-items:center;color:var(--pink);font-size:17px;margin-left:-8px}
.back svg{width:26px;height:26px}

.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 10px;height:36px;margin-bottom:12px;color:var(--label2)}
.search svg{width:16px;height:16px;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;color:var(--label);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--label2)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}

.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:14px}
.seg button{flex:1;font-size:13px;font-weight:500;padding:6px 0;border-radius:7px;transition:background .2s,box-shadow .2s}
.seg button.on{background:var(--seg-on);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
.seg.small{margin:0;width:156px;flex:none}

.btns{display:flex;gap:12px;margin:0 0 18px}
.btns .btn{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pink);color:#fff;font-weight:600;font-size:17px;border-radius:12px;padding:13px 22px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.soft{background:var(--card);color:var(--pink)}

/* ---------- Grouped lists ---------- */
.group{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:24px}
.ghead{font-size:13px;text-transform:uppercase;letter-spacing:.2px;color:var(--label2);margin:0 16px 7px}
.gfoot{font-size:13px;color:var(--label2);margin:-17px 16px 24px;line-height:1.38}
.row{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 12px;min-height:44px;position:relative;width:100%;text-align:left;cursor:pointer}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:72px;height:.5px;background:var(--sep)}
.row.plain{padding:11px 16px}
.row.plain+.row.plain::before{left:16px}
.row:active{background:var(--fill)}
.row.static{cursor:default}.row.static:active{background:none}
.lbl{flex:1;font-size:17px}
.val{color:var(--label2);font-size:17px;text-align:right}
.chev{color:var(--label3);flex:none}.chev svg{width:14px;height:14px}
.meta{flex:1;min-width:0}
.t1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row.cur .t1{color:var(--pink);font-weight:600}
.more{width:34px;height:34px;display:grid;place-items:center;color:var(--label2);flex:none;border-radius:17px}
.more svg{width:20px;height:20px}
.more:active{background:var(--fill)}
.none{color:var(--label2);text-align:center;padding:22px 0;font-size:15px;margin:0}

/* ---------- Artwork ---------- */
.art{width:48px;height:48px;border-radius:8px;flex:none;background-size:cover;background-position:center;display:grid;place-items:center;overflow:hidden;background-color:var(--fill)}
.art.ph{background-image:linear-gradient(var(--a,135deg),var(--indigo),var(--pink),var(--orange))}
.art.ph svg{width:44%;height:44%;color:rgba(255,255,255,.92)}
.art.add{background:var(--fill);color:var(--pink)}
.art.add svg{width:22px;height:22px}
.art.sm{width:40px;height:40px;border-radius:7px}
.art.big{width:210px;height:210px;border-radius:12px;box-shadow:var(--shadow)}
.mosaic{display:grid;grid-template-columns:1fr 1fr;width:48px;height:48px;border-radius:8px;overflow:hidden;flex:none}
.mosaic .art{width:100%;height:100%;border-radius:0}
.mosaic.big{width:210px;height:210px;border-radius:12px;box-shadow:var(--shadow)}
.mosaic .art.ph svg{width:36%}

.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px;margin-right:6px;vertical-align:-1px}
.eq i{width:3px;background:var(--pink);border-radius:1px;height:40%;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
body:not(.playing) .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:48px 20px 10px}
.empty .big{width:104px;height:104px;margin:0 auto 22px;border-radius:24px;background:#000;display:grid;place-items:center;box-shadow:var(--shadow)}
.empty .big svg{width:78px}
.empty h2{font-size:22px;margin:0 0 8px}
.empty p{color:var(--label2);font-size:15px;margin:0 auto 24px;line-height:1.45;max-width:300px}
.steps{text-align:left;margin-top:34px}

/* ---------- Playlist header ---------- */
.plhead{text-align:center;margin:6px 0 18px}
.plhead>.art,.plhead>.mosaic{margin:0 auto 16px}
.plhead h2{font-size:22px;margin:0 0 4px}
.plhead p{color:var(--label2);font-size:15px;margin:0}

/* ---------- Tab bar + mini player ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;font-size:10px;font-weight:500;color:#8E8E93}
.tabbar button svg{width:25px;height:25px}
.tabbar button.on{color:var(--pink)}
.tabbar button.pop svg{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(.8)}75%{transform:scale(1.1)}}

.mini{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 58px);z-index:19;display:none;align-items:center;gap:10px;padding:8px 6px 8px 8px;border-radius:14px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;max-width:664px;margin:0 auto}
.mini.show{display:flex;animation:up .4s cubic-bezier(.2,.8,.2,1)}
.mini .t1{font-size:15px;font-weight:500}
.mini .t2{font-size:13px}
.ctl{width:40px;height:40px;display:grid;place-items:center;border-radius:20px;flex:none}
.ctl svg{width:24px;height:24px}
.ctl:active{background:var(--fill)}
.mini .pg{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--grad);background-size:100vw 100%}

/* ---------- Now Playing ---------- */
.np{position:fixed;inset:0;z-index:40;background:var(--bg);transform:translateY(100%);transition:transform .5s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 6px) 26px calc(env(safe-area-inset-bottom) + 16px);overflow:hidden;isolation:isolate;visibility:hidden}
.np.open{transform:none;visibility:visible}
.np.moving{visibility:visible}
.glow{position:absolute;inset:-30%;z-index:-1;background-size:cover;background-position:center;filter:blur(70px) saturate(1.7);opacity:.5;transition:background-image .4s}
.glow.ph{background-image:linear-gradient(135deg,var(--indigo),var(--pink),var(--orange));opacity:.32}
.np-top{flex:1;display:flex;flex-direction:column;min-height:0}
.grab{width:100%;height:26px;display:grid;place-items:center;flex:none}
.grab::after{content:"";width:38px;height:5px;border-radius:3px;background:var(--label3)}
.wrap-art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px 0}
.art.npa{width:min(100%,46vh,440px);height:auto;aspect-ratio:1;border-radius:14px;box-shadow:0 22px 50px rgba(0,0,0,.35);transition:transform .55s cubic-bezier(.34,1.4,.64,1)}
.np.paused .art.npa{transform:scale(.84)}
.np .info{display:flex;align-items:center;gap:10px;margin:18px 0 14px}
.np .info .t1{font-size:21px;font-weight:600}
.np .info .t2{font-size:17px;margin-top:3px}
.circle{background:var(--fill);color:var(--label)}
.scrub{position:relative;height:24px;display:flex;align-items:center;touch-action:none;cursor:pointer}
.scrub .tr{height:6px;border-radius:4px;background:var(--fill2);width:100%;overflow:hidden;transition:height .2s}
.scrub.drag .tr{height:12px}
.scrub .fl{height:100%;width:0;background:var(--grad);background-size:calc(100vw - 52px) 100%}
.times{display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:var(--label2);font-variant-numeric:tabular-nums;margin-top:2px}
.ctrls{display:flex;justify-content:space-evenly;align-items:center;margin:14px 0 20px}
.ctrls button{display:grid;place-items:center;border-radius:50%;transition:transform .15s,background .15s;position:relative;color:var(--label)}
.ctrls button:active{transform:scale(.86);background:var(--fill)}
.ctrls .pp{width:84px;height:84px}.ctrls .pp svg{width:56px;height:56px}
.ctrls .sk{width:60px;height:60px}.ctrls .sk svg{width:40px;height:40px}
.ctrls .jump{width:52px;height:52px;display:none}.ctrls .jump svg{width:32px;height:32px}
.ctrls .jump span{position:absolute;font-size:9px;font-weight:700;top:50%;left:50%;transform:translate(-50%,-38%)}
.np.long .ctrls .jump{display:grid}
.np.long .ctrls .sk{width:46px;height:46px}.np.long .ctrls .sk svg{width:28px;height:28px}
.extras{display:flex;justify-content:space-between;align-items:center}
.extras button{height:38px;min-width:42px;padding:0 9px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--label2);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;transition:background .2s,color .2s}
.extras button.on{color:var(--pink);background:var(--fill)}
.extras svg{width:22px;height:22px}

/* ---------- Modals ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;opacity:0;transition:opacity .3s}
.scrim.show{opacity:1}
.alert{position:fixed;left:50%;top:46%;width:270px;transform:translate(-50%,-50%) scale(1.12);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.3,1.2),opacity .2s;background:var(--sheet);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;z-index:61;text-align:center;overflow:hidden}
.alert.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.alert .bd{padding:19px 16px 16px}
.alert h3{font-size:17px;margin:0 0 4px;font-weight:600}
.alert p{font-size:13px;margin:0;line-height:1.38}
.alert input{width:100%;margin-top:12px;padding:8px;border-radius:7px;border:.5px solid var(--sep);background:var(--card);color:var(--label);font-size:15px;outline:none}
.alert input+input{margin-top:8px}
.alert .ab{display:flex;border-top:.5px solid var(--sep)}
.alert .ab button{flex:1;padding:11px 0;font-size:17px;color:var(--blue)}
.alert .ab button+button{border-left:.5px solid var(--sep)}
.alert .ab .bold{font-weight:600}
.alert .ab .danger{color:var(--red);font-weight:600}
.asheet{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:61;transform:translateY(130%);transition:transform .4s cubic-bezier(.32,.72,0,1);max-width:520px;margin:0 auto}
.asheet.show{transform:none}
.asheet .g{background:var(--sheet);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;margin-bottom:8px;max-height:62vh;overflow-y:auto}
.asheet .hd{padding:14px 16px;text-align:center;font-size:13px;color:var(--label2);border-bottom:.5px solid var(--sep);line-height:1.35}
.asheet .hd b{display:block;color:var(--label2);font-weight:600}
.asheet .g button{display:block;width:100%;padding:17px 12px;font-size:19px;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asheet .g button+button{border-top:.5px solid var(--sep)}
.asheet .g button:active{background:var(--fill)}
.asheet .danger{color:var(--red)!important}
.asheet .sel{font-weight:600}
.asheet .cancel{font-weight:600;background:var(--elev)}
.asheet .cancel-g{background:var(--elev)}
.fsheet{position:fixed;left:0;right:0;bottom:0;height:calc(100% - env(safe-area-inset-top) - 14px);z-index:61;background:var(--bg);border-radius:12px 12px 0 0;transform:translateY(100%);transition:transform .45s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;max-width:680px;margin:0 auto}
.fsheet.show{transform:none}
.fsheet .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;gap:8px}
.fsheet .nav h3{margin:0;font-size:17px;font-weight:600;flex:1;text-align:center}
.fsheet .nav button{color:var(--pink);font-size:17px;min-width:64px;text-align:left}
.fsheet .nav .r{text-align:right;font-weight:600}
.fsheet .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(env(safe-area-inset-bottom) + 24px)}
.chk{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--label3);flex:none;display:grid;place-items:center;transition:background .2s,border-color .2s;margin-right:4px}
.chk.on{background:var(--pink);border-color:var(--pink)}
.chk.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.3px 2.3px 0;transform:translate(0,-1px) rotate(45deg);animation:tick .25s ease}
@keyframes tick{from{transform:translate(0,-1px) rotate(45deg) scale(.3)}}
.tg{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;transition:background .25s;flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .3s cubic-bezier(.3,1.4,.6,1)}
.tg.on{background:var(--green)}.tg.on::after{transform:translateX(20px)}
.qlabel{font-size:20px;font-weight:700;margin:6px 4px 8px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-180%);background:var(--sheet);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);padding:11px 18px;border-radius:24px;font-size:15px;font-weight:600;z-index:90;box-shadow:var(--shadow);transition:transform .45s cubic-bezier(.32,.72,0,1);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}

/* ---------- Speed slider ---------- */
.spd-body{padding:10px 20px 20px}
.spd-val{font-size:46px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.5px;margin:4px 0 10px;color:var(--label)}
.slider{position:relative;height:44px;margin:0 14px;touch-action:none;cursor:pointer;outline:none}
.sl-tr{position:absolute;left:0;right:0;top:50%;height:5px;margin-top:-2.5px;border-radius:3px;background:var(--fill2);overflow:hidden}
.sl-fl{height:100%;width:0;background:var(--grad);background-size:calc(100vw - 72px) 100%}
.sl-th{position:absolute;top:50%;left:0;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#fff;box-shadow:0 .5px 4px rgba(0,0,0,.14),0 6px 13px rgba(0,0,0,.14);transition:transform .2s}
.slider.drag .sl-th{transform:scale(1.12)}
.sl-ends{position:relative;height:16px;margin:2px 14px 16px;font-size:12px;font-weight:500;color:var(--label2)}
.sl-ends span{position:absolute;transform:translateX(-50%)}
.sl-ends span:nth-child(1){left:0}.sl-ends span:nth-child(2){left:20%}.sl-ends span:nth-child(3){left:60%}.sl-ends span:nth-child(4){left:100%}
.asheet .g .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.asheet .g .chips button{display:inline-block;width:auto;padding:8px 13px;border-radius:17px;background:var(--fill);font-size:15px;font-weight:600;color:var(--label);border:0;transition:background .2s,color .2s}
.asheet .g .chips button.on{background:var(--pink);color:#fff}

/* ---------- Launch ---------- */
.splash{position:fixed;inset:0;background:#000;z-index:100;display:grid;place-items:center;transition:opacity .4s ease}
.splash.out{opacity:0;pointer-events:none}
.splash svg{width:190px;overflow:visible}
.splash .w path{stroke:#fff;stroke-width:9;stroke-linecap:round;fill:none;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s cubic-bezier(.4,0,.2,1) forwards}
.splash .c{opacity:0;animation:fadein .45s ease forwards;animation-delay:1s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}

/* ---------- Motion ---------- */
.tab.on .anim{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.tab.on .anim:nth-child(2){animation-delay:.03s}.tab.on .anim:nth-child(3){animation-delay:.06s}
.tab.on .anim:nth-child(4){animation-delay:.09s}.tab.on .anim:nth-child(5){animation-delay:.12s}
.tab.on .anim:nth-child(n+6){animation-delay:.15s}
.slidein{animation:slidein .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
@keyframes slidein{from{opacity:0;transform:translateX(28px)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="splash" id="splash"></div>
<main>
  <section class="tab on" id="t-lib"></section>
  <section class="tab" id="t-pl"></section>
  <section class="tab" id="t-set"></section>
</main>
<audio id="audio" playsinline preload="auto"></audio>

/* ================= Import ================= */
async function importFiles(list) {
  const files = [...list].filter(f => /^audio\//.test(f.type) || /\.(mp3|m4a|aac|wav)$/i.test(f.name));
  if (!files.length) { toast('No audio files selected'); return; }
  let ok = 0, dup = 0, fail = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (tracks.some(t => t.file === f.name && t.size === f.size)) { dup++; continue; }
    toast(files.length > 1 ? `Importing ${i + 1} of ${files.length}…` : 'Importing…', 0);
    try { await importOne(f); ok++; }
    catch (e) {
      console.error(e); fail++;
      if (e && e.name === 'QuotaExceededError') {
        await alertBox({ title: 'Not Enough Space', msg: 'Your iPhone is out of room for more music. Delete some songs or free up space, then try again.' });
        break;
      }
    }
  }
  renderAll();
  const bits = [];
  if (ok) bits.push(`Added ${plural(ok, 'song')}`);
  if (dup) bits.push(`${dup} already in library`);
  if (fail) bits.push(`${fail} couldn't be read`);
  toast(bits.join(' · ') || 'Nothing imported');
  if (ok) requestPersist();
}
async function importOne(f) {
  const buf = await f.arrayBuffer();
  const type = f.type || guessType(f.name);
  const blob = new Blob([buf], { type });
  const tags = parseID3(new Uint8Array(buf));
  const base = f.name.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim();
  let title = tags.title, artist = tags.artist;
  if (!title) {
    const parts = base.split(/\s+[-–—]\s+/);
    if (parts.length >= 2) { artist = artist || parts[0]; title = parts.slice(1).join(' - '); }
    else title = base;
  }
  const duration = await getDuration(blob);

  let hasArt = false;

  if (cur && set.has(cur)) { stopAudio(); P.queue = []; P.order = []; P.idx = -1; }
  else {
    P.queue = P.queue.filter(x => !set.has(x)); P.order = P.order.filter(x => !set.has(x));
    P.idx = cur ? P.queue.indexOf(cur) : -1;
  }
  savePlayer();
}

audio.addEventListener('play', () => { if (P.loadedId) audio.playbackRate = P.speed; renderPlayState(); });
audio.addEventListener('pause', () => { renderPlayState(); if (P.loadedId) savePos(); });
audio.addEventListener('timeupdate', () => onTime());
audio.addEventListener('ended', async () => {
  if (!P.loadedId) return;
  const t = byId(P.loadedId);
  if (t) { t.plays = (t.plays || 0) + 1; t.pos = 0; idb.put('tracks', t).catch(() => {}); }
  if (P.sleep && P.sleep.end) { P.sleep = null; renderModes(); toast('Sleep timer ended'); renderPlayState(); return; }
  if (P.repeat === 'one') { audio.currentTime = 0; audio.play().catch(() => {}); return; }
  next(true);
});
audio.addEventListener('loadedmetadata', () => {
  const t = byId(P.loadedId);
  if (t && isFinite(audio.duration) && audio.duration > 0 && Math.abs((t.duration || 0) - audio.duration) > 1) {
    t.duration = audio.duration; idb.put('tracks', t).catch(() => {}); renderNow();
  }
  onTime();
});
audio.addEventListener('error', () => {
  if (!P.loadedId || audio.getAttribute('src') === SILENT) return;
  toast("This file can't be played on iPhone");
});

function onTime() {
  const d = audio.duration, c = audio.currentTime;
  const has = isFinite(d) && d > 0, r = has && P.loadedId ? c / d : 0;
  if (!dragging) {
    $('#npFill').style.width = (r * 100) + '%';
    $('#npCur').textContent = fmt(P.loadedId ? c : (LS.get('player', {}).pos || 0));
    const t = byId(curId());
    $('#npRem').textContent = '-' + fmt(has && P.loadedId ? d - c : (t ? t.duration : 0));
  }
  $('#miniPg').style.width = (r * 100) + '%';
  if (P.sleep && P.sleep.at) {
    if (Date.now() >= P.sleep.at) { P.sleep = null; audio.pause(); toast('Sleep timer ended'); renderModes(); }
    else renderSleepLabel();
  }
  const now = Date.now();
  if (!audio.paused && P.loadedId && now - lastSave > 5000) { lastSave = now; savePos(); }
  if (has && P.loadedId && now - lastPS > 1000 && 'mediaSession' in navigator && navigator.mediaSession.setPositionState) {
    lastPS = now;
    try { navigator.mediaSession.setPositionState({ duration: d, playbackRate: audio.playbackRate || 1, position: Math.min(c, d) }); } catch {}
  }
}

/* ---------- Lock screen / Control Centre ---------- */
function updateMediaSession(t) {
  if (!('mediaSession' in navigator)) return;
  const ms = navigator.mediaSession;
  const fallback = new URL('icons/icon-512.png', location.href).href;
  const setMeta = src => { try { ms.metadata = new MediaMetadata({ title: t.title, artist: t.artist || 'Echo', album: t.album || '', artwork: [{ src, sizes: '512x512', type: src.startsWith('data:image/jpeg') ? 'image/jpeg' : 'image/png' }] }); } catch {} };
  setMeta(fallback);
  if (t.hasArt) artDataURL(t.id).then(u => { if (u && P.loadedId === t.id) setMeta(u); });
  const h = (a, f) => { try { ms.setActionHandler(a, f); } catch {} };
  const long = t.duration >= 600;
  h('play', () => { audio.muted = false; audio.play().catch(() => {}); });
  h('pause', () => audio.pause());
  h('previoustrack', long ? null : () => prev());
  h('nexttrack', long ? null : () => next());
  h('seekbackward', long ? d => seekBy(-((d && d.seekOffset) || settings.skip)) : null);
  h('seekforward', long ? d => seekBy((d && d.seekOffset) || settings.skip) : null);
  h('seekto', d => { if (d && isFinite(d.seekTime)) { audio.currentTime = d.seekTime; onTime(); } });
}

function bindNP() {
  const sc = $('#scrub');
  const ratio = e => { const r = sc.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
  const show = r => { const d = audio.duration; $('#npFill').style.width = r * 100 + '%'; $('#npCur').textContent = fmt(r * d); $('#npRem').textContent = '-' + fmt(d - r * d); };
  sc.addEventListener('pointerdown', e => { if (!P.loadedId || !isFinite(audio.duration)) return; dragging = true; sc.setPointerCapture(e.pointerId); sc.classList.add('drag'); show(ratio(e)); });
  sc.addEventListener('pointermove', e => { if (dragging) show(ratio(e)); });
  const end = e => { if (!dragging) return; dragging = false; sc.classList.remove('drag'); audio.currentTime = ratio(e) * audio.duration; onTime(); };
  sc.addEventListener('pointerup', end);
  sc.addEventListener('pointercancel', () => { dragging = false; sc.classList.remove('drag'); onTime(); });
  // Swipe down on the artwork to close
  const top = $('#npTop'); let sy = null, dy = 0;
  top.addEventListener('touchstart', e => { sy = e.touches[0].clientY; dy = 0; np.style.transition = 'none'; np.classList.add('moving'); }, { passive: true });
  top.addEventListener('touchmove', e => { if (sy == null) return; dy = Math.max(0, e.touches[0].clientY - sy); np.style.transform = `translateY(${dy}px)`; }, { passive: true });
  const fin = () => { if (sy == null) return; np.style.transition = ''; np.style.transform = ''; np.classList.remove('moving'); if (dy > 110) closeNP(); sy = null; };
  top.addEventListener('touchend', fin); top.addEventListener('touchcancel', fin);
}

/* ================= Modals ================= */
function mount(...els) { $('#modal-root').append(...els); requestAnimationFrame(() => requestAnimationFrame(() => els.forEach(e => e.classList.add('show')))); }
function unmount(...els) { els.forEach(e => e.classList.remove('show')); setTimeout(() => els.forEach(e => e.remove()), 420); }
function el(tag, cls) { const e = document.createElement(tag); e.className = cls; return e; }

function alertBox({ title, msg = '', fields = [], ok = 'OK', cancel = null, danger = false }) {
  return new Promise(res => {
    const sc = el('div', 'scrim'), al = el('div', 'alert');
    al.innerHTML = `<div class="bd"><h3>${esc(title)}</h3>${msg ? `<p>${esc(msg)}</p>` : ''}${fields.map(f => `<input value="${esc(f.value || '')}" placeholder="${esc(f.placeholder || '')}" autocomplete="off" enterkeyhint="done">`).join('')}</div><div class="ab">${cancel ? `<button data-r="0">${esc(cancel)}</button>` : ''}<button data-r="1" class="${danger ? 'danger' : 'bold'}">${esc(ok)}</button></div>`;
    mount(sc, al);
    const ins = [...al.querySelectorAll('input')];
    if (ins[0]) { ins[0].focus(); }
    const done = v => { unmount(sc, al); res(v); };
    al.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r === '1' ? (fields.length ? ins.map(i => i.value.trim()) : true) : null); });
    ins.forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); done(ins.map(x => x.value.trim())); } }));
  });
}
function actionSheet({ title = '', sub = '', items }) {
  return new Promise(res => {
    const sc = el('div', 'scrim'), sh = el('div', 'asheet');
    sh.innerHTML = `<div class="g">${title || sub ? `<div class="hd">${title ? `<b>${esc(title)}</b>` : ''}${esc(sub)}</div>` : ''}${items.map((it, i) => `<button data-i="${i}" class="${it.danger ? 'danger' : ''} ${it.sel ? 'sel' : ''}">${esc(it.label)}</button>`).join('')}</div><div class="g cancel-g"><button class="cancel" data-i="-1">Cancel</button></div>`;
    mount(sc, sh);
    const done = v => { unmount(sc, sh); res(v); };
    sh.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; const i = +b.dataset.i; done(i < 0 ? null : items[i].k); });
    sc.addEventListener('click', () => done(null));
  });
}
function fullSheet({ title, left = '', right = 'Done', build }) {
  return new Promise(res => {
    const sc = el('div', 'scrim'), sh = el('div', 'fsheet');
    sh.innerHTML = `<div class="nav"><button data-f="left">${esc(left)}</button><h3>${esc(title)}</h3><button data-f="right" class="r">${esc(right)}</button></div><div class="body"></div>`;
    const done = v => { unmount(sc, sh); res(v); };
    build(sh.querySelector('.body'), done);
    mount(sc, sh);
    sh.querySelector('.nav').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b && b.textContent) done(b.dataset.f); });
    sc.addEventListener('click', () => done(null));
  });
}
let toastTimer;
function toast(msg, ms = 2400) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');

/* ================= Flows ================= */
async function trackMenu(id, ctx) {
  const t = byId(id); if (!t) return;
  const inPl = ctx && ctx.startsWith('pl:');
  const items = [{ k: 'next', label: 'Play Next' }, { k: 'addpl', label: 'Add to Playlist…' }];
  if (inPl) items.push({ k: 'rmpl', label: 'Remove from Playlist' });
  items.push({ k: 'edit', label: 'Edit Title & Artist' }, { k: 'del', label: 'Delete from Library', danger: true });
  const k = await actionSheet({ title: t.title, sub: t.artist || 'Unknown Artist', items });
  if (k === 'next') playNext(id);
  else if (k === 'addpl') addToPlaylist([id]);
  else if (k === 'rmpl') { const pl = playlists.find(p => p.id === ctx.slice(3)); if (pl) { pl.ids = pl.ids.filter(x => x !== id); await idb.put('playlists', pl); renderPlDetail(); renderPlaylists(); } }
  else if (k === 'edit') editInfo(id);
  else if (k === 'del') deleteTracks([id]);
}
async function addToPlaylist(ids) {
  let pl;
  const k = await actionSheet({ title: 'Add to Playlist', items: [{ k: '__new', label: 'New Playlist…' }, ...playlists.map(p => ({ k: p.id, label: p.name }))] });
  if (!k) return;
  if (k === '__new') { pl = await createPlaylist(false); if (!pl) return; }
  else pl = playlists.find(p => p.id === k);
  const added = ids.filter(id => !pl.ids.includes(id));
  pl.ids.push(...added);
  await idb.put('playlists', pl);
  renderPlaylists(); if (openPl === pl.id) renderPlDetail();
  toast(added.length ? `Added to ${pl.name}` : `Already in ${pl.name}`);
}
async function createPlaylist(open = true) {
  const r = await alertBox({ title: 'New Playlist', msg: 'Give it a name.', fields: [{ placeholder: 'Playlist name' }], ok: 'Create', cancel: 'Cancel' });
  if (!r || !r[0]) return null;
  const pl = { id: uid(), name: r[0], ids: [], createdAt: Date.now() };
  await idb.put('playlists', pl); playlists.push(pl);
  renderPlaylists();
  if (open) { switchTab('pl'); openPlaylist(pl.id); if (tracks.length) pickSongs(pl); }
  return pl;
}
async function pickSongs(pl) {
  const sel = new Set(pl.ids.filter(byId));
  const r = await fullSheet({
    title: 'Add Songs', left: 'Cancel', right: 'Done',
    build(body) {
      body.innerHTML = `<label class="search">${I.search}<input type="search" placeholder="Search" autocomplete="off"></label><div class="group"></div>`;
      const inp = body.querySelector('input'), grp = body.querySelector('.group');
      const draw = () => {
        const q = inp.value.trim().toLowerCase();
        const list = tracks.slice().sort((a, b) => a.title.localeCompare(b.title)).filter(t => !q || `${t.title} ${t.artist}`.toLowerCase().includes(q));
        grp.innerHTML = list.map(t => `<div class="row" data-pick="${t.id}">${artHTML(t)}<div class="meta"><div class="t1">${esc(t.title)}</div><div class="t2">${esc(t.artist || 'Unknown Artist')}</div></div><span class="chk${sel.has(t.id) ? ' on' : ''}"></span></div>`).join('') || '<p class="none">No songs</p>';
        hydrate(grp);
      };
      draw(); inp.addEventListener('input', draw);
      grp.addEventListener('click', e => { const row = e.target.closest('[data-pick]'); if (!row) return; const id = row.dataset.pick; sel.has(id) ? sel.delete(id) : sel.add(id); row.querySelector('.chk').classList.toggle('on', sel.has(id)); });
    }
  });
  if (r !== 'right') return;
  pl.ids = [...pl.ids.filter(id => sel.has(id)), ...[...sel].filter(id => !pl.ids.includes(id))];
  await idb.put('playlists', pl);
  renderPlaylists(); renderPlDetail();
}
async function playlistMenu() {
  const pl = playlists.find(p => p.id === openPl); if (!pl) return;
  const k = await actionSheet({ title: pl.name, items: [{ k: 'ren', label: 'Rename' }, { k: 'del', label: 'Delete Playlist', danger: true }] });
  if (k === 'ren') {
    const r = await alertBox({ title: 'Rename Playlist', fields: [{ value: pl.name, placeholder: 'Playlist name' }], ok: 'Save', cancel: 'Cancel' });
    if (r && r[0]) { pl.name = r[0]; await idb.put('playlists', pl); renderPlDetail(); renderPlaylists(); }
  } else if (k === 'del') {
    const ok = await alertBox({ title: `Delete “${pl.name}”?`, msg: 'The songs stay in your library.', ok: 'Delete', cancel: 'Cancel', danger: true });
    if (ok) { await idb.del('playlists', pl.id); playlists = playlists.filter(p => p.id !== pl.id); closePl(); }
  }
}
async function editInfo(id) {
  const t = byId(id); if (!t) return;
  const r = await alertBox({ title: 'Edit Song', fields: [{ value: t.title, placeholder: 'Title' }, { value: t.artist, placeholder: 'Artist' }], ok: 'Save', cancel: 'Cancel' });
  if (!r) return;
  t.title = r[0] || t.title; t.artist = r[1];
  await idb.put('tracks', t);
  renderAll(); if (P.loadedId === id) updateMediaSession(t);
}
async function deleteTracks(ids) {
  const one = ids.length === 1 ? byId(ids[0]) : null;
  const ok = await alertBox({ title: one ? `Delete “${one.title}”?` : `Delete ${plural(ids.length, 'song')}?`, msg: 'This removes it from Echo on this iPhone. The original file in Files isn\'t touched.', ok: 'Delete', cancel: 'Cancel', danger: true });
  if (!ok) return;
  const set = new Set(ids);
  dropFromQueue(set);
  for (const id of ids) { await idb.del('blobs', id); await idb.del('art', id); await idb.del('tracks', id); forgetArt(id); }
  tracks = tracks.filter(t => !set.has(t.id));
  for (const pl of playlists) if (pl.ids.some(x => set.has(x))) { pl.ids = pl.ids.filter(x => !set.has(x)); await idb.put('playlists', pl); }
  renderAll();
  toast(ids.length === 1 ? 'Song deleted' : `${plural(ids.length, 'song')} deleted`);
}
async function wipeAll() {
  const ok = await alertBox({ title: 'Delete All Music?', msg: `This removes all ${plural(tracks.length, 'song')} and every playlist from Echo. Your files in the Files app aren't touched.`, ok: 'Delete All', cancel: 'Cancel', danger: true });
  if (!ok) return;
  stopAudio(); P.queue = []; P.order = []; P.idx = -1; P.sleep = null; LS.del('player');
  await Promise.all(['tracks', 'blobs', 'art', 'playlists'].map(s => idb.clear(s)));
  tracks.forEach(t => forgetArt(t.id)); tracks = []; playlists = []; openPl = null;
  $('#plDetail').hidden = true; $('#plList').hidden = false;
  renderAll(); toast('All music deleted');
}
const SPEED_MIN = .5, SPEED_MAX = 3, SPEED_STEP = .05;
const fmtSpeed = v => String(+v.toFixed(2)) + '×';
function applySpeed(v) {
  v = Math.round(Math.min(SPEED_MAX, Math.max(SPEED_MIN, v)) / SPEED_STEP) * SPEED_STEP;
  P.speed = +v.toFixed(2);
  audio.defaultPlaybackRate = P.speed;
  if (P.loadedId) audio.playbackRate = P.speed;
  renderModes();
  return P.speed;
}
function speedMenu() {
  const sc = el('div', 'scrim'), sh = el('div', 'asheet');
  sh.innerHTML = `<div class="g spd"><div class="hd"><b>Playback Speed</b>Drag to any speed from 0.5× to 3×</div>
    <div class="spd-body">
      <div class="spd-val"></div>
      <div class="slider" role="slider" aria-label="Playback speed" aria-valuemin="${SPEED_MIN}" aria-valuemax="${SPEED_MAX}" tabindex="0"><div class="sl-tr"><div class="sl-fl"></div></div><div class="sl-th"></div></div>
      <div class="sl-ends"><span>0.5×</span><span>1×</span><span>2×</span><span>3×</span></div>
      <div class="chips">${[.75, 1, 1.25, 1.5, 2].map(v => `<button data-v="${v}">${v}×</button>`).join('')}</div>
    </div></div><div class="g cancel-g"><button class="cancel" data-done>Done</button></div>`;
  mount(sc, sh);
  const sl = sh.querySelector('.slider'), fl = sh.querySelector('.sl-fl'), th = sh.querySelector('.sl-th'), val = sh.querySelector('.spd-val');
  const show = v => {
    const r = (v - SPEED_MIN) / (SPEED_MAX - SPEED_MIN);
    fl.style.width = r * 100 + '%'; th.style.left = r * 100 + '%';
    val.textContent = fmtSpeed(v); sl.setAttribute('aria-valuenow', v);
    sh.querySelectorAll('.chips button').forEach(b => b.classList.toggle('on', +b.dataset.v === v));
  };
  const set = v => show(applySpeed(v));
  show(P.speed);
  const ratio = e => { const r = sl.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
  let drag = false;
  sl.addEventListener('pointerdown', e => { drag = true; sl.setPointerCapture(e.pointerId); sl.classList.add('drag'); set(SPEED_MIN + ratio(e) * (SPEED_MAX - SPEED_MIN)); });
  sl.addEventListener('pointermove', e => { if (drag) set(SPEED_MIN + ratio(e) * (SPEED_MAX - SPEED_MIN)); });
  const stop = () => { drag = false; sl.classList.remove('drag'); };
  sl.addEventListener('pointerup', stop); sl.addEventListener('pointercancel', stop);
  sl.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowUp') set(P.speed + SPEED_STEP); if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') set(P.speed - SPEED_STEP); });
  sh.querySelector('.chips').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) set(+b.dataset.v); });
  const done = () => { unmount(sc, sh); savePlayer(); };
  sh.querySelector('[data-done]').addEventListener('click', done);
  sc.addEventListener('click', done);
}
async function sleepMenu() {
  const items = [{ k: '15', label: '15 Minutes' }, { k: '30', label: '30 Minutes' }, { k: '45', label: '45 Minutes' }, { k: '60', label: '1 Hour' }, { k: 'end', label: 'End of Current Song' }];
  if (P.sleep) items.unshift({ k: 'off', label: 'Turn Off Timer', danger: true });
  const k = await actionSheet({ title: 'Sleep Timer', sub: 'Music stops when the timer ends.', items });
  if (!k) return;
  if (k === 'off') P.sleep = null;
  else if (k === 'end') P.sleep = { end: true };
  else P.sleep = { at: Date.now() + (+k) * 60000 };
  renderModes();
  if (P.sleep) toast(P.sleep.end ? 'Stopping after this song' : `Stopping in ${k} min`);
}
async function showQueue() {
  await fullSheet({
    title: 'Up Next', right: 'Done',
    build(body, done) {
      const cur = byId(curId());
      const up = P.queue.slice(P.idx + 1).map((id, j) => ({ t: byId(id), i: P.idx + 1 + j })).filter(x => x.t);
      body.innerHTML = `${cur ? `<p class="qlabel">Now Playing</p><div class="group"><div class="row cur static">${artHTML(cur)}<div class="meta"><div class="t1">${esc(cur.title)}</div><div class="t2">${esc(cur.artist || 'Unknown Artist')}</div></div></div></div>` : ''}
        <p class="qlabel">Up Next${P.shuffle ? ' · Shuffled' : ''}</p>
        <div class="group">${up.map(x => `<div class="row" data-q="${x.i}">${artHTML(x.t)}<div class="meta"><div class="t1">${esc(x.t.title)}</div><div class="t2">${esc(x.t.artist || 'Unknown Artist')} · ${fmt(x.t.duration)}</div></div></div>`).join('') || `<p class="none">${P.repeat === 'all' ? 'Repeats from the start' : 'Nothing else queued'}</p>`}</div>`;
      hydrate(body);
      body.addEventListener('click', e => { const r = e.target.closest('[data-q]'); if (!r) return; prime(); loadIdx(+r.dataset.q, true); done('pick'); });
    }
  });
}
async function npMenu() {
  const id = curId(); const t = byId(id); if (!t) return;
  const k = await actionSheet({ title: t.title, sub: t.artist || 'Unknown Artist', items: [{ k: 'addpl', label: 'Add to Playlist…' }, { k: 'edit', label: 'Edit Title & Artist' }] });
  if (k === 'addpl') addToPlaylist([id]);
  else if (k === 'edit') editInfo(id);
}
function switchTab(k) {
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('on', s.id === 't-' + k));
  document.querySelectorAll('#tabbar button').forEach(b => {
    const on = b.dataset.tab === k; b.classList.toggle('on', on);
    if (on) { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
  });
  if (k === 'set') renderSettings();
  if (k === 'lib') $('#hello').textContent = `${greeting()}, ${NAME}`;
  window.scrollTo(0, 0);
}

/* ================= Actions ================= */
const ACT = {
  tab: a => { if (a.classList.contains('on') && a.dataset.tab === 'pl' && openPl) closePl(); switchTab(a.dataset.tab); },
  import: () => $('#file').click(),
  sort: a => { settings.sort = a.dataset.v; saveSettings(); renderLibrary(); },
  play: (a, id, ctx) => {
    if (curId() === id && P.loadedId === id) { openNP(); return; }
    prime(); const ids = ctxIds(ctx); playList(ids, ids.indexOf(id));
  },
  more: (a, id, ctx) => trackMenu(id, ctx),
  playall: () => { prime(); playList(ctxIds('lib'), 0, false); },
  shuffleall: () => { prime(); playList(ctxIds('lib'), -1, true); },
  toggle: () => togglePlay(),
  next: () => next(),
  prev: () => prev(),
  jumpb: () => seekBy(-settings.skip),
  jumpf: () => seekBy(settings.skip),
  npopen: () => openNP(),
  npclose: () => closeNP(),
  npmore: () => npMenu(),
  shuffle: () => toggleShuffle(),
  repeat: () => cycleRepeat(),
  speed: () => speedMenu(),
  sleep: () => sleepMenu(),
  queue: () => showQueue(),
  newpl: () => createPlaylist(true),
  openpl: (a, id) => openPlaylist(id),
  plback: () => closePl(),
  plmore: () => playlistMenu(),
  pladd: () => { const pl = playlists.find(p => p.id === openPl); if (pl) { if (tracks.length) pickSongs(pl); else toast('Import some songs first'); } },
  plplay: () => { prime(); playList(ctxIds('pl:' + openPl), 0, false); },
  plshuffle: () => { prime(); playList(ctxIds('pl:' + openPl), -1, true); },
  persist: async () => { await requestPersist(); let ok = false; try { ok = await navigator.storage.persisted(); } catch {} toast(ok ? 'Music is protected' : "iPhone didn't allow it yet. Keep Echo on your Home Screen and try later."); renderSettings(); },
  resume: () => { settings.resume = !settings.resume; saveSettings(); renderSettings(); },
  skipint: a => { settings.skip = +a.dataset.v; saveSettings(); renderSettings(); renderNow(); },
  checkupd: async () => {
    if (!swReg) { toast("Updates aren't available here"); return; }
    toast('Checking…', 0);
    try { await swReg.update(); } catch {}
    setTimeout(() => toast(swReg.installing || swReg.waiting ? 'Updating…' : "You're on the latest version"), 900);
  },
  wipe: () => wipeAll()
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const f = ACT[a.dataset.act]; if (f) f(a, a.dataset.id, a.dataset.ctx, e);
});
document.addEventListener('touchstart', () => {}, { passive: true });
$('#file').addEventListener('change', e => { const f = e.target.files; if (f && f.length) importFiles(f); e.target.value = ''; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (P.loadedId) savePos(); }
  else { $('#hello').textContent = `${greeting()}, ${NAME}`; if (swReg) swReg.update().catch(() => {}); if (pendingReload && audio.paused) location.reload(); }
});

/* ================= Launch animation ================= */
function runSplash() {
  const sp = $('#splash');
  if (reduceMotion) { sp.remove(); return; }
  sp.innerHTML = `<svg viewBox="0 0 200 120"><defs><linearGradient id="sg" gradientUnits="userSpaceOnUse" x1="14" x2="186" y1="0" y2="0"><stop offset="0" stop-color="#5E5CE6"/><stop offset=".5" stop-color="#FF375F"/><stop offset="1" stop-color="#FF9F0A"/></linearGradient></defs>
    <g class="w">${BARS.map((h, i) => { const x = 20 + i * 20, d = (Math.abs(i - 4) * .08 + .1).toFixed(2); return `<path pathLength="1" d="M${x} 60V${60 - h / 2}" style="animation-delay:${d}s"/><path pathLength="1" d="M${x} 60V${60 + h / 2}" style="animation-delay:${d}s"/>`; }).join('')}</g>
    <g class="c">${BARS.map((h, i) => `<line x1="${20 + i * 20}" x2="${20 + i * 20}" y1="${60 - h / 2}" y2="${60 + h / 2}" stroke="url(#sg)" stroke-width="9" stroke-linecap="round"/>`).join('')}</g></svg>`;
  const hide = () => { if (!sp.isConnected) return; sp.classList.add('out'); setTimeout(() => sp.remove(), 450); };
  sp.addEventListener('click', hide);
  setTimeout(hide, 1700);
}

/* ================= Updates ================= */
let swReg = null, pendingReload = false;
if ('serviceWorker' in navigator && location.protocol === 'https:' || location.hostname === 'localhost') {
  if ('serviceWorker' in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { swReg = r; r.update().catch(() => {}); }).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController) return;
      if (audio.paused) location.reload(); else pendingReload = true;
    });
  }
}

/* ================= Start ================= */
(async () => {
  runSplash();
  buildShell(); bindNP();
  try { db = await openDB(); }
  catch (e) { renderAll(); alertBox({ title: "Storage Isn't Available", msg: 'Echo needs on-device storage to save music. Private Browsing turns this off.' }); return; }
  tracks = await idb.all('tracks');
  playlists = (await idb.all('playlists')).sort((a, b) => a.createdAt - b.createdAt);
  const s = LS.get('player', null);
  if (s) {
    P.shuffle = !!s.shuffle; P.repeat = s.repeat || 'off'; P.speed = s.speed || 1;
    P.queue = (s.queue || []).filter(byId); P.order = (s.order || []).filter(byId);
    P.idx = s.cur ? P.queue.indexOf(s.cur) : -1;
  }
  renderAll();
  if (P.idx >= 0) await loadIdx(P.idx, false, s.pos || 0);
})();
</script>
